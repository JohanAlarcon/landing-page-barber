<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img"
  aria-label="Catálogo de servicios y diseños de uñas en ReservaBot">
  <title>ReservaBot · Catálogo de servicios y diseños</title>
  <defs>
    <linearGradient id="ns-bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#0D1B2B" />
      <stop offset="1" stop-color="#081420" />
    </linearGradient>
    <linearGradient id="ns-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF5FA2" />
      <stop offset="1" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="d1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9BC6" /><stop offset="1" stop-color="#FF5FA2" />
    </linearGradient>
    <linearGradient id="d2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C4B5FD" /><stop offset="1" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="d3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE68A" /><stop offset="1" stop-color="#FB923C" />
    </linearGradient>
    <linearGradient id="d4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A7F3D0" /><stop offset="1" stop-color="#22DE7A" />
    </linearGradient>
    <style>
      .t { font-family: Montserrat, 'Segoe UI', Arial, sans-serif; }
      .muted { fill: #8CA3B8; }
      .white { fill: #F2F7FA; }
      .b7 { font-weight: 700; }
      .b8 { font-weight: 800; }
    </style>
  </defs>

  <rect width="1200" height="800" rx="20" fill="url(#ns-bg)" />
  <rect x="0.5" y="0.5" width="1199" height="799" rx="20" fill="none" stroke="#2A3550" />

  <path d="M0 20a20 20 0 0 1 20-20h1160a20 20 0 0 1 20 20v32H0z" fill="#0A1826" />
  <line x1="0" y1="52" x2="1200" y2="52" stroke="#2A3550" />
  <circle cx="28" cy="27" r="5.5" fill="#46506E" />
  <circle cx="48" cy="27" r="5.5" fill="#46506E" />
  <circle cx="68" cy="27" r="5.5" fill="#46506E" />
  <rect x="440" y="15" width="320" height="24" rx="12" fill="#1B2440" />
  <text class="t muted" x="600" y="31" font-size="12" text-anchor="middle">app.reservabot.co/servicios</text>

  <rect x="0" y="52" width="200" height="748" fill="#0A1725" />
  <line x1="200" y1="52" x2="200" y2="800" stroke="#2A3550" />
  <rect x="22" y="76" width="30" height="30" rx="9" fill="#22DE7A" />
  <path d="M31 91.5 L35 95.5 L43 87" fill="none" stroke="#0A1725" stroke-width="3.4" stroke-linecap="round"
