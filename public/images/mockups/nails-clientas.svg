<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img"
  aria-label="Ficha de una clienta con su historial en ReservaBot">
  <title>ReservaBot · Ficha de la clienta y su historial</title>
  <defs>
    <linearGradient id="nc-bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#0D1B2B" />
      <stop offset="1" stop-color="#081420" />
    </linearGradient>
    <linearGradient id="nc-avatar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9BC6" />
      <stop offset="1" stop-color="#A855F7" />
    </linearGradient>
    <style>
      .t { font-family: Montserrat, 'Segoe UI', Arial, sans-serif; }
      .muted { fill: #8CA3B8; }
      .white { fill: #F2F7FA; }
      .b7 { font-weight: 700; }
      .b8 { font-weight: 800; }
    </style>
  </defs>

  <rect width="1200" height="800" rx="20" fill="url(#nc-bg)" />
  <rect x="0.5" y="0.5" width="1199" height="799" rx="20" fill="none" stroke="#2A3550" />

  <path d="M0 20a20 20 0 0 1 20-20h1160a20 20 0 0 1 20 20v32H0z" fill="#0A1826" />
  <line x1="0" y1="52" x2="1200" y2="52" stroke="#2A3550" />
  <circle cx="28" cy="27" r="5.5" fill="#46506E" />
  <circle cx="48" cy="27" r="5.5" fill="#46506E" />
  <circle cx="68" cy="27" r="5.5" fill="#46506E" />
  <rect x="440" y="15" width="320" height="24" rx="12" fill="#1B2440" />
  <text class="t muted" x="600" y="31" font-size="12" text-anchor="middle">app.reservabot.co/clientas</text>

  <rect x="0" y="52" width="200" height="748" fill="#0A1725" />
  <line x1="200" y1="52" x2="200" y2="800" stroke="#2A3550" />
  <rect x="22" y="76" width="30" height="30" rx="9" fill="#22DE7A" />
  <path d="M31 91.5 L35 95.5 L43 87" fill="none" stroke="#0A1725" stroke-width="3.4" stroke-linecap="round"
    stroke-linejoin="round" />
  <text class="t white b8" x="62" y="96" font-size="15">ReservaBot</text>
  <text class="t muted" x="40" y="157" font-size="13.5">Agenda</text>
  <rect x="16" y="180" width="168" height="40" rx="11" fill="#FF5FA2" opacity="0.16" />
  <rect x="16" y="180" width="3" height="40" rx="2" fill="#FF5FA2" />
  <text class="t white b7" x="40" y="205" font-size="13.5">Clientas</text>
  <text class="t muted" x="40" y="253" font-size="13.5">Servicios</text>
  <text class="t muted" x="40" y="301" font-size="13.5">Diseños</text>
  <text class="t muted" x="40" y="349" font-size="13.5">Abonos</text>
  <text class="t muted" x="40" y="397" font-size="13.5">Reportes</text>

  <text class="t white b8" x="232" y="102" font-size="27">Ficha de la clienta</text>
  <text class="t muted" x="232" y="128" font-size="14">Todo su historial en un solo lugar</text>

  <!-- Tarjeta de perfil -->
  <rect x="232" y="158" width="380" height="332" rx="16" fill="#101F31" stroke="#2A3550" />
  <circle cx="422" cy="228" r="42" fill="url(#nc-avatar)" />
  <text class="t b8" x="422" y="240" font-size="30" fill="#160A14" text-anchor="middle">VR</text>
  <text class="t white b8" x="422" y="300" font-size="19" text-anchor="middle">Valentina Ríos</text>
  <text class="t muted" x="422" y="322" font-size="12.5" text-anchor="middle">+57 310 442 1180</text>

  <rect x="264" y="344" width="150" height="62" rx="12" fill="#0C1A2A" stroke="#2A3550" />
  <text class="t muted" x="339" y="366" font-size="11" text-anchor="middle">VISITAS</text>
  <text class="t white b8" x="339" y="392" font-size="21" text-anchor="middle">14</text>

  <rect x="430" y="344" width="150" height="62" rx="12" fill="#0C1A2A" stroke="#2A3550" />
  <text class="t muted" x="505" y="366" font-size="11" text-anchor="middle">GASTO TOTAL</text>
  <text class="t white b8" x="505" y="392" font-size="21" text-anchor="middle">$1.840.000</text>

  <rect x="264" y="422" width="316" height="44" rx="12" fill="#FF5FA2" opacity="0.14" />
  <text class="t b8" x="422" y="450" font-size="13" fill="#FF9BC6" text-anchor="middle">Retoque sugerido: 2 de septiembre</text>

  <!-- Preferencias -->
  <rect x="636" y="158" width="532" height="332" rx="16" fill="#101F31" stroke="#2A3550" />
  <text class="t white b8" x="664" y="194" font-size="16">Preferencias y notas</text>

  <rect x="664" y="214" width="120" height="28" rx="14" fill="#FF5FA2" opacity="0.18" />
  <text class="t b7" x="724" y="233" font-size="11.5" fill="#FF9BC6" text-anchor="middle">Acrílicas largas</text>
  <rect x="796" y="214" width="112" height="28" rx="14" fill="#A855F7" opacity="0.2" />
  <text class="t b7" x="852" y="233" font-size="11.5" fill="#C4B5FD" text-anchor="middle">Forma almendra</text>
  <rect x="920" y="214" width="100" height="28" rx="14" fill="#22DE7A" opacity="0.16" />
  <text class="t b7" x="970" y="233" font-size="11.5" fill="#A7F3D0" text-anchor="middle">Tonos nude</text>

  <rect x="664" y="258" width="476" height="76" rx="12" fill="#0C1A2A" stroke="#2A3550" />
  <text class="t muted" x="684" y="284" font-size="12.5">“Alérgica al removedor con acetona. Prefiere</text>
  <text class="t muted" x="684" y="306" font-size="12.5">cita en la tarde y siempre pide diseño en dos uñas.”</text>

  <text class="t white b8" x="664" y="368" font-size="14">Cumpleaños</text>
  <text class="t muted" x="664" y="390" font-size="12.5">14 de marzo</text>
  <text class="t white b8" x="900" y="368" font-size="14">Clienta desde</text>
  <text class="t muted" x="900" y="390" font-size="12.5">Febrero 2025</text>

  <rect x="664" y="418" width="476" height="46" rx="12" fill="#0E2A22" stroke="#22DE7A" stroke-opacity="0.4" />
  <text class="t b7" x="902" y="446" font-size="12.5" fill="#22DE7A" text-anchor="middle">
    WhatsApp de recordatorio activo
  </text>

  <!-- Historial -->
  <rect x="232" y="512" width="936" height="256" rx="16" fill="#101F31" stroke="#2A3550" />
  <text class="t white b8" x="260" y="548" font-size="16">Historial de servicios</text>

  <g>
    <line x1="260" y1="566" x2="1140" y2="566" stroke="#2A3550" />
    <text class="t muted" x="260" y="592" font-size="12.5">12 ago 2025</text>
    <text class="t white b7" x="420" y="592" font-size="13">Acrílicas + baño de gel</text>
    <text class="t muted" x="800" y="592" font-size="12.5">2 h 30 min</text>
    <text class="t white b8" x="1140" y="592" font-size="13.5" text-anchor="end">$155.000</text>

    <line x1="260" y1="612" x2="1140" y2="612" stroke="#2A3550" />
    <text class="t muted" x="260" y="638" font-size="12.5">22 jul 2025</text>
    <text class="t white b7" x="420" y="638" font-size="13">Retoque de acrílicas</text>
    <text class="t muted" x="800" y="638" font-size="12.5">1 hora</text>
    <text class="t white b8" x="1140" y="638" font-size="13.5" text-anchor="end">$45.000</text>

    <line x1="260" y1="658" x2="1140" y2="658" stroke="#2A3550" />
    <text class="t muted" x="260" y="684" font-size="12.5">01 jul 2025</text>
    <text class="t white b7" x="420" y="684" font-size="13">Semipermanente + diseño</text>
    <text class="t muted" x="800" y="684" font-size="12.5">1 h 45 min</text>
    <text class="t white b8" x="1140" y="684" font-size="13.5" text-anchor="end">$81.000</text>

    <line x1="260" y1="704" x2="1140" y2="704" stroke="#2A3550" />
    <text class="t muted" x="260" y="730" font-size="12.5">10 jun 2025</text>
    <text class="t white b7" x="420" y="730" font-size="13">Pedicure spa</text>
    <text class="t muted" x="800" y="730" font-size="12.5">1 h 30 min</text>
    <text class="t white b8" x="1140" y="730" font-size="13.5" text-anchor="end">$70.000</text>
  </g>
</svg>
