<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img"
  aria-label="ReservaBot · Tu recepcionista que nunca duerme">
  <title>ReservaBot · Tu recepcionista que nunca duerme</title>
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C2033" />
      <stop offset="0.6" stop-color="#08131F" />
      <stop offset="1" stop-color="#050D16" />
    </linearGradient>
    <radialGradient id="og-glow" cx="0.85" cy="0.2" r="0.65">
      <stop offset="0" stop-color="#22DE7A" stop-opacity="0.28" />
      <stop offset="1" stop-color="#22DE7A" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="og-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DF48D" />
      <stop offset="1" stop-color="#10AE5B" />
    </linearGradient>
    <pattern id="og-dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#FFFFFF" opacity="0.06" />
    </pattern>
    <style>
      .t { font-family: Montserrat, 'Segoe UI', Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#og-bg)" />
  <rect width="1200" height="630" fill="url(#og-dots)" />
  <rect width="1200" height="630" fill="url(#og-glow)" />

  <!-- Marca -->
  <g transform="translate(80,74)">
    <g fill="url(#og-mark)">
      <rect x="0" y="0" width="58" height="52" rx="16" />
      <path d="M14 48 L8 62 L28 50 Z" />
    </g>
    <rect x="20" y="9" width="4.5" height="9" rx="2.2" fill="#FFFFFF" />
    <rect x="34" y="9" width="4.5" height="9" rx="2.2" fill="#FFFFFF" />
    <rect x="13" y="14" width="33" height="30" rx="7" fill="#FFFFFF" />
    <path d="M20 32 L26 38 L38 25.5" fill="none" stroke="#10AE5B" stroke-width="5" stroke-linecap="round"
      stroke-linejoin="round" />
    <text class="t" x="76" y="36" font-size="30" font-weight="800" fill="#F2F7FA">Reserva<tspan
        fill="#22DE7A">Bot</tspan></text>
  </g>

  <!-- Etiqueta -->
  <rect x="80" y="182" width="360" height="42" rx="21" fill="#22DE7A" fill-opacity="0.15" stroke="#22DE7A"
    stroke-opacity="0.45" />
  <circle cx="106" cy="203" r="5" fill="#22DE7A" />
  <text class="t" x="124" y="209" font-size="15" font-weight="800" letter-spacing="1.8" fill="#22DE7A">
    BARBERÍAS &amp; SALONES DE UÑAS
  </text>

  <!-- Titular -->
  <text class="t" x="80" y="308" font-size="68" font-weight="800" fill="#F2F7FA">Tu agenda llena</text>
  <text class="t" x="80" y="392" font-size="82" font-weight="800" fill="#22DE7A">24/7</text>
  <text class="t" x="80" y="442" font-size="26" font-weight="500" fill="#93AABD">Sin contestar un solo mensaje.</text>

  <!-- Beneficios -->
  <g>
    <circle cx="94" cy="492" r="11" fill="#22DE7A" />
    <path d="M88.5 492 L92.5 496 L100 488" fill="none" stroke="#08131F" stroke-width="2.6" stroke-linecap="round"
      stroke-linejoin="round" />
    <text class="t" x="116" y="498" font-size="20" font-weight="700" fill="#F2F7FA">Tus clientes reservan solos</text>

    <circle cx="94" cy="534" r="11" fill="#22DE7A" />
    <path d="M88.5 534 L92.5 538 L100 530" fill="none" stroke="#08131F" stroke-width="2.6" stroke-linecap="round"
      stroke-linejoin="round" />
    <text class="t" x="116" y="540" font-size="20" font-weight="700" fill="#F2F7FA">Confirma y recuerda la cita</text>
  </g>

  <!-- Sello de mes gratis -->
  <g transform="translate(80,566)">
    <rect width="272" height="42" rx="21" fill="#22DE7A" />
    <text class="t" x="136" y="28" font-size="17" font-weight="800" fill="#04241A" text-anchor="middle">
      PRIMER MES GRATIS
    </text>
  </g>

  <!-- Chat de la derecha -->
  <g>
    <rect x="712" y="72" width="416" height="486" rx="34" fill="#0A1826" stroke="#22354A" stroke-width="2" />
    <path d="M714 106a32 32 0 0 1 32-32h348a32 32 0 0 1 32 32v46H714z" fill="#22DE7A" fill-opacity="0.16" />
    <line x1="714" y1="152" x2="1126" y2="152" stroke="#FFFFFF" stroke-opacity="0.08" />
    <circle cx="756" cy="114" r="19" fill="#22DE7A" />
    <path d="M748 114 L754 120 L765 108" fill="none" stroke="#08131F" stroke-width="3.6" stroke-linecap="round"
      stroke-linejoin="round" />
    <text class="t" x="786" y="112" font-size="16" font-weight="800" fill="#F2F7FA">ReservaBot</text>
    <circle cx="791" cy="128" r="3.5" fill="#22DE7A" />
    <text class="t" x="802" y="133" font-size="12" fill="#93AABD">en línea</text>

    <rect x="736" y="180" width="252" height="46" rx="16" fill="#FFFFFF" fill-opacity="0.08" />
    <text class="t" x="754" y="209" font-size="15" font-weight="500" fill="#E4EDF5">Hola 👋 Quiero manicure hoy</text>

    <rect x="794" y="242" width="310" height="46" rx="16" fill="#12B45F" />
    <text class="t" x="812" y="271" font-size="15" font-weight="500" fill="#EAFFF4">¡Claro! Tengo 3:00 y 5:30 pm ✨</text>

    <rect x="736" y="304" width="118" height="42" rx="16" fill="#FFFFFF" fill-opacity="0.08" />
    <text class="t" x="754" y="331" font-size="15" font-weight="500" fill="#E4EDF5">3:00 pm</text>

    <rect x="794" y="362" width="310" height="76" rx="16" fill="#12B45F" />
    <path d="M814 390 L820 396 L832 382" fill="none" stroke="#EAFFF4" stroke-width="4" stroke-linecap="round"
      stroke-linejoin="round" />
    <text class="t" x="844" y="396" font-size="15" font-weight="800" fill="#EAFFF4">Cita confirmada</text>
    <text class="t" x="814" y="424" font-size="14" font-weight="500" fill="#EAFFF4">Hoy 3:00 pm · Manicure</text>

    <rect x="794" y="454" width="310" height="46" rx="16" fill="#12B45F" />
    <text class="t" x="812" y="483" font-size="15" font-weight="500" fill="#EAFFF4">Te recordaré 2 h antes ⏰</text>
  </g>
</svg>
